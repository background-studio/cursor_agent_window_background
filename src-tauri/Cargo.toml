[package]
name = "cursor-agent-background-studio"
version = "0.1.1"
description = "A headless Background Studio worker for the Cursor Agents window."
authors = ["Background Studio contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[features]
integration-test-pipe = []

[lib]
name = "cursor_agent_background_studio_lib"
path = "src/lib.rs"

[[bin]]
name = "cursor-agent-background-studio"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
sha2 = "0.10.9"
url = "2.5.8"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "native-tls-no-alpn", "stream"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
base64 = "0.22.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
